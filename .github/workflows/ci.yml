name: ci

# CI 分层口径（指标分层陈述，不把单测数/评测样本数/浏览器场景数混加为大数字）：
# - 第 1 层（本 workflow，push/PR 自动跑）：快速检查 = 各模块单测 + 前端 type-check 构建；
# - 第 2 层（本地/手动）：集成验收——acceptance/ 下 d1 主链路、d2 写操作确认、cow_offline_lifecycle、
#   cow_72h_capacity、cow_mqtt_http_dedup、cow_device_flip 等（需本地起 PostgreSQL/Redis/Mosquitto/四服务）；
# - 第 3 层（本地/手动）：需真实 LLM Key 的智能体对话与演示录制——不接受外部模型波动阻塞 PR。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cow-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: mvn test
        working-directory: cow-admin
        run: mvn -B test

  cow-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install deps
        working-directory: cow-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio httpx
      - name: pytest
        working-directory: cow-agent
        run: python -m pytest tests/

  cow-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install deps
        working-directory: cow-ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: pytest
        working-directory: cow-ai
        run: python -m pytest tests/

  cow-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm ci & build（含 vue-tsc type-check 前置）
        working-directory: cow-web
        run: |
          npm ci
          npm run build
