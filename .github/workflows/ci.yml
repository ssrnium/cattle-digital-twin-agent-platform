name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cow-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: mvn test
        working-directory: cow-admin
        run: mvn -B test

  cow-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install deps
        working-directory: cow-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio httpx
      - name: pytest
        working-directory: cow-agent
        run: python -m pytest tests/

  cow-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install deps
        working-directory: cow-ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: pytest
        working-directory: cow-ai
        run: python -m pytest tests/

  cow-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm ci & build（含 vue-tsc type-check 前置）
        working-directory: cow-web
        run: |
          npm ci
          npm run build
